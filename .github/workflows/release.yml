name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/globird/manifest.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: the tag comes from manifest.json
# inside the job, so runs are serialised as a whole. A run must not delete or
# publish a draft another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag_exists: ${{ steps.extract.outputs.tag_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate version and extract release notes from CHANGELOG.md
        id: extract
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/globird/manifest.json").read_text(encoding="utf-8")
          )
          version = str(manifest.get("version", "")).strip()

          # Validate Home Assistant CalVer format (e.g. 2026.10.0 or 2026.10.0b1)
          ha_version_re = re.compile(r"^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+([a-z0-9.-]+)?$")
          if not ha_version_re.match(version):
              print(
                  f"::error::manifest.json version '{version}' does not match Home Assistant versioning (e.g. 2026.10.0).",
                  file=sys.stderr,
              )
              sys.exit(1)

          changelog_text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+\[?{re.escape(version)}\]?(?:\s+-\s+[^\n]+)?\s*$",
              re.MULTILINE,
          )
          match = pattern.search(changelog_text)
          if not match:
              print(
                  f"::error::Version {version} from manifest.json was not found in CHANGELOG.md.",
                  file=sys.stderr,
              )
              sys.exit(1)

          start_idx = match.end()
          next_heading = re.search(r"^##\s+\[?", changelog_text[start_idx:], re.MULTILINE)
          if next_heading:
              notes = changelog_text[start_idx : start_idx + next_heading.start()].strip()
          else:
              notes = changelog_text[start_idx:].strip()

          if not notes:
              print(
                  f"::error::CHANGELOG.md section for {version} is empty.",
                  file=sys.stderr,
              )
              sys.exit(1)

          # Written next to the zip, so the publish job reads the same notes.
          notes_path = Path("dist/release_notes.md")
          notes_path.parent.mkdir(parents=True, exist_ok=True)
          notes_path.write_text(notes + "\n", encoding="utf-8")

          # Check if tag already exists in git/GitHub
          tag_exists = (
              subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{version}"],
                  capture_output=True,
                  text=True,
                  check=False,
              ).returncode
              == 0
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag_exists={'true' if tag_exists else 'false'}\n")

          print(f"Validated version {version} (tag_exists={tag_exists})")
          EOF

      - name: Build release zip
        if: steps.extract.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist --version "$VERSION"

      - name: Attest build provenance
        if: steps.extract.outputs.tag_exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/globird.zip

      - name: Upload release assets
        if: steps.extract.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify dist/globird.zip --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          # A rerun after a failed publish finds the earlier run's draft for
          # this tag (the tag itself only exists once a release is published):
          # delete it so the rerun starts from one clean draft.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/release_notes.md \
            dist/globird.zip \
            dist/SHA256SUMS \
            CHANGELOG.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Verify the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          # Fails when release immutability is off, so the setting can't lapse unnoticed.
          gh release verify "$TAG"
          gh release verify-asset "$TAG" dist/globird.zip
