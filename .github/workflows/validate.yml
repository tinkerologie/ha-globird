name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: 0 0 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manifest.json and CHANGELOG.md version sync
        run: |
          python3 - <<'EOF'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/globird/manifest.json").read_text(encoding="utf-8")
          )
          pyproject = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          manifest_ver = str(manifest.get("version", "")).strip()
          pyproject_ver = str(pyproject.get("project", {}).get("version", "")).strip()

          ha_re = re.compile(r"^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+([a-z0-9.-]+)?$")
          if not ha_re.match(manifest_ver):
              sys.exit(f"Invalid Home Assistant version format in manifest.json: {manifest_ver}")
          if manifest_ver != pyproject_ver:
              sys.exit(f"Version mismatch: manifest.json ({manifest_ver}) != pyproject.toml ({pyproject_ver})")
          if not re.search(rf"^##\s+\[?{re.escape(manifest_ver)}\]?", changelog, re.MULTILINE):
              sys.exit(f"Version {manifest_ver} missing from CHANGELOG.md")
          print(f"Version {manifest_ver} verified in manifest.json, pyproject.toml, and CHANGELOG.md")
          EOF

  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  release-zip:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build twice and compare
        run: |
          # The script refuses to write a zip with a broken layout; building twice
          # proves the same commit always gives the same bytes.
          VERSION=$(jq -r '.version' custom_components/globird/manifest.json)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist/a --version "$VERSION"
          python3 script/build_release_zip.py --output-dir dist/b --version "$VERSION"
          cmp dist/a/globird.zip dist/b/globird.zip
          (cd dist/a && sha256sum -c SHA256SUMS)

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
