[project]
name = "ha-globird"
version = "2026.10.4"
description = "GloBird Home Assistant custom integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
	"--cov=custom_components.globird",
	"--cov-branch",
	"--cov-report=term-missing",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "TRY", "RUF", "DTZ", "PYI"]
ignore = ["E501", "S101", "TRY003", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"custom_components/globird/const.py" = ["S105"]
"tests/*" = ["RUF012", "DTZ011", "PYI034", "S101", "S105", "S106", "TRY003"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".local", "build"]
skips = ["B101"]


[tool.setuptools.package-data]
"custom_components.globird" = ["www/*.js"]
